[build]
  command = "pnpm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Cada ruta se prerenderiza a su propio HTML (scripts/prerender.mjs), así que no
# hace falta redirigir todo a index.html: las rutas inexistentes reciben
# dist/404.html con estado 404.
